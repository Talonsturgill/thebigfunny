# The Big Funny — scoring rubric and gates
#
# Two kinds of check. HARD GATES fail the ATTEMPT outright and no score can
# rescue them. The WEIGHTED SCORE decides whether an attempt that is legal and
# true is also good enough to ship.
#
# NOTHING HERE ENDS A RUN. A failure sends the run back to fix the work and try
# again, and the job is to deliver one video. Fix the work, never the standard:
# the two never conflict, because the work is infinitely re-choosable (there are
# seven beats and the whole public record) and the standard is not.
#
# Scores are honest. An episode that is not funny gets REWRITTEN, not shipped
# with a generous grade. The upstream publication learned this the expensive
# way: a rubric that always passes is a rubric that measures nothing, and the
# machine will happily grade its own homework forever if you let it.

hard_gates:

  - id: sourced
    name: Every claim traced to a document
    rule: >
      Every factual line in the VO carries a claim-id resolving to a primary
      source that was actually fetched. Zero exceptions. A claim that cannot be
      proven is cut, and if cutting it kills the angle then that story is done
      and the run takes the next one. Never soften a claim to keep an angle.
    fails_run: true

  - id: sixty_seconds
    name: 60 seconds or under
    rule: >
      Final render duration <= 60.0s. Target 50 to 58. This is a law, not a
      target (see CLAUDE.md). Over by any amount fails.
    fails_run: true

  - id: punch_direction
    name: Punching at institutions only
    rule: >
      The target is an institution, a company, or a public figure acting in
      public. No private individuals. No protected classes. A customer service
      worker, a nurse, a driver or a clerk is a fellow hostage and is never the
      target.
    fails_run: true

  - id: platform_survivable
    name: Crude, not fatal
    rule: >
      No slurs, no hate, no sexual content, no harassment of a named private
      person, no calls to action against anyone. Profanity is fine. These are
      ban conditions, not demonetization conditions, and one of them ends the
      channel.
    fails_run: true

  - id: not_partisan
    name: No party takes a side
    rule: >
      The episode does not advantage or attack a political party or candidate.
      If the story cannot be told without doing so, it is the wrong story.
    fails_run: true

  - id: institution_faceless
    name: The Institution has no face
    rule: >
      The antagonist never emotes, never negotiates, never gets a facial
      expression. It emits policy, hold music, euphemism and forms. See
      CAST_BIBLE.md; a creative gate in the upstream engine already rejected a
      cartoon envelope for pulling a face and that ruling is law here.
    fails_run: true

  - id: variety
    name: Not a repeat
    rule: >
      Subject not run within 30 days (ledger/topics.json). Angle TYPE not used
      more than twice in the last 7 episodes (ledger/bits.json). Visual system
      diverges from recent runs per ledger/artwork.json divergence rules.
    fails_run: true

  - id: faces_visible
    name: Somebody's face is big enough to read
    rule: >
      scripts/face_size.py exits 0. At least one cast placement puts a head at
      20% of frame height or more, and the MEDIAN placement is at 7% or more.
      Case 0003 shipped with every character under 8% of frame and a median of
      4.7%, which is a ninety pixel head, about seven millimetres on a phone,
      and the owner called the cast "a piece of furniture in the screen". It was
      not a figure of speech. face_check verifies the expressions exist; this
      verifies they are visible, and an episode can pass the first while failing
      the second. The remedy is to cut closer or split a shot, NEVER to enlarge
      a figure inside a wide, because that inflates a person against a set whose
      scale is usually the joke.
    fails_run: true

  - id: has_sound_design
    name: The cartoon makes a sound other than talking
    rule: >
      scripts/mix_check.py exits 0 and the muxed audio is out/dispatch/mix.wav,
      not vo.wav. Three episodes shipped as dialogue over digital silence while
      a seventeen-kind SFX bank with six takes each, a shuffle bag and a curated
      real-recording tier sat in the repo with no caller. The gate reads the
      AUDIO, not the cue sheet: it checks the delivered mix differs from the VO,
      that the loudest effect is audible against the voice without burying it,
      that nothing clips, that no twelve second stretch of the film is
      voice-only, and that a declared score is actually under the film rather
      than declared in a cue sheet and never rendered. When it fails, fix the cue sheet and the levels. A cartoon
      that goes quiet for a quarter of its runtime is a podcast with pictures.
    fails_run: true

  - id: renders_clean
    name: The file is actually good
    rule: >
      Final mp4 exists, has audio, captions are aligned to the VO within
      tolerance, no dropped frames, no missing fonts, no text outside safe area,
      1080x1920.
    fails_run: true

# ---------------------------------------------------------------------------

weighted_score:
  ship_threshold: 78
  note: >
    Below threshold you do NOT stop, and you do NOT lower the threshold. You go
    back and fix the work, then score again. A gate failure ends an attempt,
    never the run. See the remedy table in Phase 6 of the routine: there is a
    specific fix for every failure and none of them is "ship it anyway" or "try
    tomorrow". The job is to deliver one video.

  criteria:

    - id: funny
      weight: 35
      name: Is it actually funny, and does it have teeth
      note: >
        The heaviest single criterion, because it is the only open question. The
        rest of this machine was already proven by two shipping publications;
        funny is the new risk and it gets weighted like it.
      scale:
        90-100: >
          A specific line or beat is quotable on its own, out of context. You
          would send this to someone.
        75-89: >
          Lands. A real laugh or a hard exhale. Nothing in it embarrasses the
          show.
        60-74: >
          Amusing. Understands the joke it is telling but does not fully land
          it. Usually an angle problem, not a writing problem.
        0-59: >
          Not funny. Agreement is not comedy. If the episode's whole content is
          "this is bad and we all know it", score it here and say so. The run
          rewrites; it does not ship this and it does not stop.
      craft_check: |
        Before scoring, ask the six questions from knowledge/COMEDY_CRAFT.md:
        is there an ACT-OUT, or only description? a rule of THREE anywhere? a
        PLANT that the button pays off? do the REGISTERS collide? is any line an
        APHORISM that already exists on the internet? and WHICH WAY DOES THE
        IRONY POINT, i.e. does the joke accidentally make the institution the
        sympathetic party?
        An episode answering no, no, no, no, yes, wrong-way is a fact with a
        tone of voice. CAP IT AT 60 and say "no joke in it".

      register: >
        THIS SHOW IS FOR ADULTS. Added 2026-08-02 by the owner, after case 0002
        shipped at 79.65 while being bureaucratic trivia about a car that would
        not beep: correct, well made, and no adult would repeat it.

        Crude is not merely tolerated here, it is the register. CLAUDE.md says
        so, and this file says "Profanity is fine" in the platform gate. The
        bans are slurs, hate, sexual content and harassment, and NONE of those
        is the same thing as being blunt, angry or profane. An episode that
        stays polite is not being safe, it is being timid, and timid is the one
        failure this rubric used to reward.

        Find the border and work against it. The border is the ban list, not
        good taste.

    - id: angle
      weight: 25
      name: The angle is specific and earned
      scale:
        90-100: >
          One sentence, no context needed, gets a reaction. Maps cleanly to a
          named type in ANGLE_TAXONOMY.md.
        75-89: Specific and real, if slightly familiar.
        60-74: True but broad. Drifting toward "X is bad".
        0-59: It IS "X is bad". Back to the angle room.

    - id: ray
      weight: 15
      name: Ray is right, and says it the way a person would
      scale:
        90-100: >
          The restatement IS the joke. Short, verdict-first, no explaining.
        75-89: In voice, lands, maybe one line too many.
        60-74: Ranting rather than concluding. Explaining the joke.
        0-59: >
          Ray is a fool, or a mouthpiece, or punching down. Any of those is a
          voice failure and the fix is a rewrite, not a trim.

    - id: craft
      weight: 15
      name: It looks like somebody made it
      note: >
        Depth bar from the ported engine: form shading, rim light, contact
        shadow, real staging, deliberate shape language. The library mandate
        applies, cast from the shelf before drawing anything new.
      scale:
        90-100: A frame from this could be a poster.
        75-89: Clean, staged, on-model, reads at thumbnail size.
        60-74: Flat, or default camera, or a shelf asset used without staging.
        0-59: Looks generated.

    - id: button
      weight: 10
      name: The receipt landed
      note: >
        Every episode ends on the actual document. It is the trust mechanism and
        the show's signature.
      scale:
        90-100: >
          The document on screen is legible, damning, and the last line lands
          against it.
        75-89: Receipt present and clear.
        60-74: Receipt present but decorative or unreadable at speed.
        0-59: No receipt. Fails the show's whole premise.

# ---------------------------------------------------------------------------

funny_gate:
  note: >
    The funny score is decided by the funny-critic agent, which is adversarial
    by design and defaults to dissatisfaction. It reads the script COLD, with no
    knowledge of how hard the run worked, because effort is not funny and the
    machine will otherwise reward itself for trying.
  procedure:
    - Read the script with no production context.
    - Name the single funniest line. If you cannot, the score is capped at 59.
    - Ask, would a person send this to another person. If no, cap at 74.
    - Ask, does any line explain a joke that already landed. Each one is -5.
    - Ask, is the funniest thing in it a FACT or a WRITTEN LINE. Facts are the
      house style and score higher; a run carried entirely by written jokes is
      working against the machine's actual strengths and is capped at 84.
    - Ask, DOES IT HAVE TEETH. Would a normal adult repeat this out loud, angry,
      to another adult? If the worst thing in the episode is an inconvenience,
      or if the whole thing could be read aloud in a primary school without
      anybody blinking, CAP AT 70 and say the word "toothless" in your reason.
      This show is for adults. A tame episode is a failure of nerve, not a
      standard, and case 0002 proved the rubric would happily ship one.
  anti_gaming: >
    The critic never sees the score it is being asked to beat, never sees the
    ship threshold, and is never told what its number will cause. It grades the
    script in front of it and nothing else. A critic that knows the consequence
    starts managing the consequence.
