# The Big Funny — voice and brand tokens
#
# The cast is defined in knowledge/CAST_BIBLE.md. This file is the machine
# readable version plus the tokens the render engine needs.

show:
  name: The Big Funny
  format: 60 second animated short, 1080x1920, vertical
  cadence: daily
  one_line: >
    Something in America got worse today, and we name who did it.
  platforms:
    primary: tiktok
    also: [youtube_shorts, instagram_reels]
  posting: >
    NEVER automatic. The routine renders and drafts the copy. A human posts.

worldview:
  is: >
    The audience is everyone who has ever been put on hold. The villain is
    always an institution and never a voter. We are on the side of the person
    holding the bill.
  is_not: >
    Not political. Not left or right. Not cynical about people, only about
    processes. Not nihilist; Ray is angry precisely because he thinks it could
    be better.

cast:
  ray:
    role: the Id
    stance: RIGHT, not a fool
    register: >
      Short. Verdict-first. Restates the fact in the words a normal person would
      use, and that restatement is usually the joke. Swears like a tired adult,
      not an excited teenager. Never explains. Never punches down. Never wins.
    shape_language: warm, round, soft edges, slightly too small for the world
    poses: [panic, point, raise, arms-crossed]
    emotions: [angry, shock, smug, worried]
  dee:
    role: the Straight Man
    stance: correct, informed, powerless
    register: >
      Precise and dry. Cites the number, the date, the clause. Tried the proper
      channel first and the proper channel failed. One composure crack per
      episode.
    shape_language: upright, angular but warm, more vertical than Ray
  institution:
    role: the antagonist
    asset: MachineShadow
    stance: not evil, just working exactly as designed
    hard_rule: >
      NO FACE. EVER. The moment it can emote it becomes something you could
      negotiate with, and the premise dies.
    register: >
      Never speaks in its own voice. Emits policy text, hold music, an automated
      line, a press-release sentence, a form. Unfailingly polite. The politeness
      is the menace.
    shape_language: cold, rectilinear, too large for frame, brushed metal
    costume: >
      Re-dressed per episode (insurer, airline, landlord, HR, platform). Same
      silhouette, new livery. That is how it recurs without going stale.

voice_rules:
  - No em dashes or en dashes. No emojis. Straight quotes.
  - Cut every line that explains a joke that already landed.
  - Quote corporate euphemisms VERBATIM. Never paraphrase one.
  - One angle per episode.
  - Ray does not win.

hard_lines:
  - Punch at institutions, companies, and public figures acting in public only.
  - Never a private individual. Never a protected class.
  - No slurs, no hate, no sexual content, no harassment.
  - Profanity is fine. The above are bans, not demonetizations.

signature:
  button: >
    Every episode ends on the actual document: the filing, the policy page, the
    price change, the memo. It is the trust mechanism and the thing no
    competitor does, because no competitor has a fact-check gate.

# ---------------------------------------------------------------------------
# Identity. Full reasoning in knowledge/BRAND_BIBLE.md; the enforceable version
# is video-engine/src/lib/brand.tsx, because a style guide is a suggestion and a
# component is a fact.

promise: "We didn't make this up. We have the filing."

palette:
  # Built ON the art library's existing tokens, never beside them. INK and
  # HIGHLIGHT already existed in Character.tsx and FX.tsx; CARBON is already
  # PaperOfficeBG's dark anchor. A parallel palette drifts within a month.
  ink:       "#101423"   # type, linework
  manila:    "#E3D4B0"   # the folder, the show's ground
  carbon:    "#4A5A66"   # the Institution, never warm
  stamp:     "#C0392B"   # ONCE per episode. see one_stamp_rule.
  highlight: "#FFE24A"   # the damning number. once.
  paper:     "#F2EADA"   # documents, captions

one_stamp_rule: >
  Stamp red appears exactly once per episode, on the thing that matters most. A
  second use halves the first. This is the discipline that keeps the palette
  from becoming decoration.

type:
  headline: "Arial Black"   # heavy, unfussy, American, reads at thumbnail size
  body: "Arial"
  case_number: "Arial, letter-spaced wide, small. It is a serial, not a headline."

case_numbers:
  format: "CASE No. 0001"
  ledger: ledger/cases.json
  rule: >
    Every RUN takes the next number, pass or fail. Never reused, never skipped.
    A gap would be the show lying about its own record.

signature_moves:
  - "Cold open, NO logo. The first two seconds are the fact, flat. Branding
     before the hook is how short-form loses its audience."
  - "The wordmark STAMPS at ~2s. Once. Hard. Slight rotation, ink bleed. It
     never fades in; a stamp is a verdict."
  - "The highlighter swipes the single worst number. Hand-drawn, overshoots."
  - "The button is the receipt: the real document, legible, stamp lands on it."
  - "End card: case number and the promise. Nothing else. The restraint is the
     flex; a show whose pitch is 'we have the receipt' should not end by begging."

titles:
  good: "CASE No. 0031 - The Ambulance Was Out Of Network. The Ambulance They Sent."
  bad: "Insurance Company Denies Ambulance Claim (INSANE)"
  rule: >
    The title is the ANGLE, not a description. No clickbait punctuation, no
    all-caps screaming (the wordmark already screams), no emoji ever.

never:
  - Abbreviate to TBF in reader-facing copy. It is always the whole dumb name.
  - Slick, gradient, glassy or tech-brand. Slick reads as marketing and
    marketing is what the Institution does.
  - A real face or real name attached to the show's voice. Ray is a character,
    not a host.
  - A bit that exists only to sell a shirt.
